name: N2S Overlay tests

on:
  push:
    paths:
      - 'n2s-overlay/**'
      - '.github/workflows/n2s-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Node and Bash syntax
        run: |
          node --check n2s-overlay/n2s-overlay.js
          node --check n2s-overlay/n2s-video.js
          node --check n2s-overlay/n2s-media.js
          node --check n2s-overlay/app.js
          bash -n n2s-overlay/n2s
          bash -n n2s-overlay/n2s-ports.sh
          bash -n n2s-overlay/n2s-nazwa
          bash -n n2s-overlay/install-overlay.sh
      - name: Test automatic port detection
        run: node --test n2s-overlay/tests/ports.test.js
      - name: Test secure WebDAV proxy
        run: node --test n2s-overlay/tests/smoke.test.js
      - name: Test authenticated media streaming
        run: node --test n2s-overlay/tests/media.test.js
      - name: Install browser DOM test dependency
        run: npm install --no-save --no-package-lock jsdom@26.1.0
      - name: Test browser player chooser
        run: node --test n2s-overlay/tests/video.test.js
      - name: Test independent UI
        run: node --test n2s-overlay/tests/independent.test.js
      - name: Test original WebDAV branding and icons
        run: node --test n2s-overlay/tests/branding.test.js
