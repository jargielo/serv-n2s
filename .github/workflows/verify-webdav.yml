name: Verify WebDAV access (one-time)

on:
  push:
    paths:
      - .github/workflows/verify-webdav.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check external HTTPS and password requirement
        shell: bash
        run: |
          url='https://jargielo.gh.srv.us/'
          echo "Checking publicly reachable WebDAV endpoint; no credentials or file contents requested."
          status=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -X PROPFIND -H 'Depth: 0' "$url") || status='connection_error'
          echo "PROPFIND without login returned: $status"
          if [ "$status" = 401 ]; then
            echo 'PASS: endpoint requires authentication.'
          elif [ "$status" = connection_error ]; then
            echo 'UNREACHABLE: no connection to WebDAV endpoint.'
            exit 1
          else
            echo 'NOT VERIFIED: expected 401 Unauthorized. Check WebDAV FS PRO settings.'
            exit 1
          fi
