name: Verify WebDAV endpoint and SSH keys
on:
  push:
    paths: [".github/workflows/verify-webdav.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check both addresses without credentials (never download files)
        shell: bash
        run: |
          for url in 'https://jargielo.gh.srv.us/' 'https://zqwy5yyvrd5ibmphemi7kwlagm.srv.us/'; do
            echo "Checking $url"
            for method in GET PROPFIND; do
              status=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -X "$method" -H 'Depth: 0' "$url") || status=connection_error
              echo "$method status: $status"
            done
          done
          curl --fail --silent --show-error --max-time 15 'https://api.github.com/users/jargielo/keys' | python3 -c 'import sys,json; print("GitHub public SSH key count:",len(json.load(sys.stdin)))'
