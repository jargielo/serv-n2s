name: Verify WebDAV endpoint and SSH keys
on:
  push:
    paths:
      - .github/workflows/verify-webdav.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check old and short addresses without credentials
        shell: bash
        run: |
          for url in 'https://jargielo.gh.srv.us/' 'https://zqwy5yyvrd5ibmphemi7kwlagm.srv.us/'; do
            echo "Checking $url"
            status=$(curl -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' -X PROPFIND -H 'Depth: 0' "$url") || status=connection_error
            echo "Unauthenticated PROPFIND: $status"
            case "$status" in
              401) echo 'Protected WebDAV endpoint reachable.' ;;
              503) echo 'Tunnel unavailable or not routing to the local server.' ;;
              000|connection_error) echo 'Network/DNS/TLS error.' ;;
              *) echo 'Unexpected response; verify authentication.' ;;
            esac
          done
          echo 'Checking public GitHub SSH keys...'
          curl --fail --silent --show-error --max-time 15 'https://api.github.com/users/jargielo/keys' | python3 -c 'import sys,json; ks=json.load(sys.stdin); print("GitHub public SSH key count:",len(ks))'
